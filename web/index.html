<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Engineering Lab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234f8cff'/><path d='M8 22 L14 10 L18 18 L24 8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try { const t = localStorage.getItem("ai-lab-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" aria-label="Primary">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <div class="brand-name">AI Engineering Lab</div>
          <div class="brand-sub">learn by building</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button class="btn ghost sm" id="theme-toggle" type="button">Toggle theme</button>
        <span class="save-status" id="save-status" role="status"></span>
      </div>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
